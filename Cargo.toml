[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/flickdeck", "apps/flickdeck-cli"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/lorenzodapolito-oss/Flickdeck"

[workspace.dependencies]
# internal
flickdeck-geom = { path = "crates/geom" }
flickdeck-color = { path = "crates/color" }
flickdeck-metafile = { path = "crates/metafile" }
flickdeck-model = { path = "crates/model" }
flickdeck-fonts = { path = "crates/fonts" }
flickdeck-text = { path = "crates/text" }
flickdeck-render = { path = "crates/render" }
flickdeck-pdf = { path = "crates/pdf" }
flickdeck-pptx = { path = "crates/pptx" }
flickdeck-format = { path = "crates/format" }
flickdeck-anim = { path = "crates/anim" }
flickdeck-engine = { path = "crates/engine" }
flickdeck-mcp = { path = "crates/mcp" }
flickdeck-ui-egui = { path = "crates/ui-egui" }
flickdeck-media = { path = "crates/media" }
# codecs (ported from FilmCraft, same owner and licence)
flickdeck-bitstream = { path = "crates/bitstream" }
flickdeck-h264 = { path = "crates/h264" }
flickdeck-hevc = { path = "crates/hevc" }
flickdeck-vp9 = { path = "crates/vp9" }
flickdeck-av1 = { path = "crates/av1" }
flickdeck-isobmff = { path = "crates/isobmff" }
flickdeck-matroska = { path = "crates/matroska" }
flickdeck-ogg = { path = "crates/ogg" }
flickdeck-opus = { path = "crates/opus" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8", version = "=0.1.0", default-features = false, features = ["write"] }
i_overlay = "9"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8", version = "=0.8.2" }
