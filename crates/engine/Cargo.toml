[package]
name = "flickdeck-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flickdeck engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
flickdeck-geom = { workspace = true }
flickdeck-color = { workspace = true }
flickdeck-model = { workspace = true }
flickdeck-fonts = { workspace = true }
flickdeck-text = { workspace = true }
flickdeck-render = { workspace = true }
flickdeck-pdf = { workspace = true }
flickdeck-format = { workspace = true }
flickdeck-pptx = { workspace = true }
flickdeck-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
flickdeck-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

