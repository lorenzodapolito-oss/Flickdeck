[package]
name = "flickdeck-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flickdeck egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
flickdeck-geom = { workspace = true }
flickdeck-color = { workspace = true }
flickdeck-model = { workspace = true }
flickdeck-fonts = { workspace = true }
flickdeck-text = { workspace = true }
flickdeck-render = { workspace = true }
flickdeck-anim = { workspace = true }
flickdeck-engine = { workspace = true }
flickdeck-media = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
