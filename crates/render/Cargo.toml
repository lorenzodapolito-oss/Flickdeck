[package]
name = "flickdeck-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flickdeck renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
flickdeck-geom = { workspace = true }
flickdeck-color = { workspace = true }
flickdeck-metafile = { workspace = true }
flickdeck-model = { workspace = true }
flickdeck-anim = { workspace = true }
flickdeck-fonts = { workspace = true }
flickdeck-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
